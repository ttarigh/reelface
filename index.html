<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Most Viral Face</title>
  <meta name="description" content="1,000 viral talking-head creators with a 3D Procrustean face mask.">
  <meta name="theme-color" content="#050507">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <!-- Wall-to-Wall Infinite Tiled Grid of 1,000 Faces (Vertical Drift) -->
  <div id="grid-viewport">
    <div id="grid-tiled-bg"></div>
    <div id="face-highlight-box"></div>
  </div>

  <!-- Center 3D Floating Face Mask Stage -->
  <div class="mask-stage" id="mask-stage">
    <div class="mask-wrapper" id="mask-wrapper">
      <div class="mask-card" id="mask-card">
        <!-- Pure 3D Mask with Eye Cutouts (No glass rings, no bouncing) -->
        <img id="mask-img" class="mask-img" src="assets/mask_1000_cutout.png?v=12" alt="Most Viral Face 3D Mask" draggable="false">
      </div>
    </div>
  </div>

  <!-- Clean Hover Tooltip for Reels -->
  <div class="creator-tooltip" id="creator-tooltip">
    <span class="c-rank" id="tooltip-rank">#0001</span>
    <span class="c-handle" id="tooltip-handle">@creator</span>
    <span class="c-hint">Click to watch Reel &rarr;</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
