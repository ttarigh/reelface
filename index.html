<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>REELFACE</title>
  <meta name="description" content="1,000 viral talking-head creators synthesized into a single 3D face mask.">
  <meta name="theme-color" content="#050507">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Wall-to-Wall Infinite Tiled Grid of 1,000 Faces (Vertical Drift) -->
  <div id="grid-viewport">
    <div id="grid-tiled-bg"></div>
  </div>

  <!-- Center 3D Floating Face Mask Stage -->
  <div class="mask-stage" id="mask-stage">
    <div class="mask-wrapper" id="mask-wrapper">
      <div class="mask-card" id="mask-card">
        <!-- Pure 3D Mask with Eye Cutouts (No glass rings, no bouncing) -->
        <img id="mask-img" class="mask-img" src="assets/mask_1000_cutout.png?v=12" alt="REELFACE 3D Mask" draggable="false">
      </div>
    </div>
  </div>

  <!-- Subtle Top-Right Print Mask Button -->
  <button id="print-mask-btn" class="print-mask-btn" type="button" aria-label="Print Mask" title="Print Wearable Mask">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="6 9 6 2 18 2 18 9"></polyline>
      <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
      <rect x="6" y="14" width="12" height="8"></rect>
    </svg>
    <span>Print</span>
  </button>

  <!-- Clean High-DPI Life-Size Mask Sheet (Visible Only When Printing to Paper) -->
  <div id="print-sheet" class="print-sheet" aria-hidden="true">
    <img id="print-mask-img" src="assets/mask_1000_print.png" alt="Printable REELFACE Mask">
  </div>

  <!-- Clean Hover Label for Reels -->
  <div class="creator-tooltip" id="creator-tooltip">
    <span class="c-rank" id="tooltip-rank">#0001</span>
    <span class="c-handle" id="tooltip-handle">@creator</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
